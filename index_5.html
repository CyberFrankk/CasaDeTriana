<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa de Triana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6EDDD;
    --rust:#C1531C;
    --umber:#6B3A22;
    --forest:#4F6B3D;
    --gold:#D9A441;
    --ink:#2E2013;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    overflow:hidden;
    background:var(--cream);
  }
  h1,h2,h3, .display{ font-family:'Fraunces', serif; }
  button{ font-family:inherit; }

  /* ===== WELCOME SCREEN ===== */
  #welcome{
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 30%, #FBF2E2, var(--cream) 70%);
    text-align:center; padding:24px;
    transition:opacity .8s ease, visibility .8s ease;
  }
  #welcome.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  #welcome h1{ font-size:clamp(28px,6vw,48px); color:var(--rust); font-style:italic; font-weight:500; }
  #welcome p{ margin-top:14px; font-size:clamp(14px,2.4vw,17px); max-width:420px; color:var(--umber); line-height:1.6; }
  #daysTogether{ margin-top:22px; font-size:14px; letter-spacing:.04em; color:var(--forest); font-weight:600; font-variant-numeric:tabular-nums; }
  #enterBtn{
    margin-top:32px; padding:14px 36px; border:none; border-radius:40px;
    background:var(--rust); color:var(--cream); font-family:'Work Sans';
    font-size:15px; font-weight:600; letter-spacing:.02em; cursor:pointer;
    box-shadow:0 6px 18px rgba(193,83,28,.35);
    transition:transform .2s ease;
  }
  #enterBtn:hover{ transform:translateY(-2px); }

  /* ===== HUB (la casa) ===== */
  #hub{
    position:relative; width:100%; height:100dvh;
    background:url('house-bg.jpg') center bottom / cover no-repeat;
    overflow:hidden;
  }
  #hub::before{
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(180deg, rgba(253,244,228,.6) 0%, rgba(253,244,228,.18) 26%, rgba(217,179,107,.1) 60%, rgba(120,74,30,.35) 100%);
  }

  #hubTitle{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    text-align:center; z-index:5;
  }
  #hubTitle h1{ color:var(--umber); font-size:clamp(20px,3.4vw,28px); font-style:italic; font-weight:500; text-shadow:0 2px 10px rgba(255,248,235,.8); }
  #hubTitle span{ font-size:12px; color:var(--forest); letter-spacing:.08em; text-transform:uppercase; text-shadow:0 1px 6px rgba(255,248,235,.8); }
  #liveCounter{
    margin-top:6px; font-size:11px; color:var(--rust); font-weight:600;
    letter-spacing:.03em; font-variant-numeric:tabular-nums; text-shadow:0 1px 6px rgba(255,248,235,.85);
  }

  #character{
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    height:78%; max-height:640px; z-index:3;
    filter:drop-shadow(0 20px 24px rgba(60,30,10,.25));
    transition:opacity .35s ease, transform .35s ease;
  }
  #character.teleporting{ opacity:0; transform:translateX(-50%) scale(.85); animation:none; }

  /* ===== ANIMACIÓN IDLE DEL PERSONAJE (respiración + balanceo suave) ===== */
  .character-img{
    animation:idleBreath 4.6s ease-in-out infinite;
    transform-origin:50% 100%;
  }
  @keyframes idleBreath{
    0%, 100%{ transform:translateX(-50%) translateY(0) rotate(0deg); }
    25%{ transform:translateX(-50%) translateY(-3px) rotate(-.5deg); }
    50%{ transform:translateX(-50%) translateY(-9px) rotate(0deg); }
    75%{ transform:translateX(-50%) translateY(-3px) rotate(.5deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .character-img{ animation:none; }
  }

  /* ===== ARBOL DE OTOÑO ===== */
  #tree{
    position:absolute; left:0.5%; bottom:0; height:52%; width:230px; z-index:2;
    pointer-events:none; filter:drop-shadow(0 10px 14px rgba(50,25,5,.25));
  }
  #tree svg{ width:100%; height:100%; overflow:visible; }
  #leaves{ position:absolute; inset:0; overflow:visible; }
  .leaf{
    position:absolute; top:16%; width:10px; height:10px;
    border-radius:0 60% 0 60%; animation:leafFall linear infinite;
  }
  @keyframes leafFall{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:.95; }
    55%{ transform:translateY(280px) translateX(var(--drift,18px)) rotate(200deg); }
    100%{ transform:translateY(520px) translateX(-4px) rotate(360deg); opacity:0; }
  }

  .room-btn{
    position:absolute; z-index:4;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background:none; border:none; cursor:pointer;
    font-family:'Work Sans'; color:var(--umber);
  }
  .room-btn .sign{
    width:52px; height:52px; border-radius:50%;
    background:var(--cream); border:2px solid var(--rust);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 14px rgba(80,40,10,.18);
    transition:transform .2s ease, background .2s ease;
  }
  .room-btn:hover .sign{ transform:translateY(-4px) scale(1.06); background:#FFF6E8; }
  .room-btn svg{ width:24px; height:24px; stroke:var(--rust); fill:none; stroke-width:1.6; }
  .room-btn .label{ font-size:11px; font-weight:600; letter-spacing:.02em; background:rgba(246,237,221,.85); padding:2px 8px; border-radius:10px; }

  #room-vestidor{ top:14%; left:8%; }
  #room-galeria{ top:10%; left:78%; }
  #room-sala{ top:32%; left:4%; }
  #room-recuerdos{ top:30%; left:86%; }
  #room-balcon{ top:52%; left:10%; }
  #room-cocina{ top:50%; left:82%; }

  /* ===== ROOM SCREEN ===== */
  #roomScreen{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center;
    text-align:center; padding:70px 20px 24px; color:var(--cream);
    opacity:0; visibility:hidden; transition:opacity .5s ease, visibility .5s ease;
    overflow-y:auto; background-size:cover; background-position:center;
  }
  #roomScreen.visible{ opacity:1; visibility:visible; }
  #roomScreen h2{ font-size:clamp(24px,4.6vw,38px); font-style:italic; font-weight:500; flex:none; text-shadow:0 2px 10px rgba(0,0,0,.4); }
  #roomScreen .genericDesc{ margin-top:12px; max-width:440px; font-size:15px; line-height:1.6; opacity:.95; text-shadow:0 1px 8px rgba(0,0,0,.4); }
  #roomScreen .tag{ margin-top:18px; font-size:11px; text-transform:uppercase; letter-spacing:.12em; opacity:.85; text-shadow:0 1px 6px rgba(0,0,0,.35); }
  .roomInner{ position:relative; z-index:2; width:100%; max-width:640px; display:flex; flex-direction:column; align-items:center; }
  #roomCharacter{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    height:48%; max-height:500px; z-index:1; pointer-events:none;
    filter:drop-shadow(0 16px 22px rgba(0,0,0,.4));
  }
  #backBtn{
    position:fixed; top:24px; left:24px; z-index:60;
    background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.5);
    color:var(--cream); padding:10px 18px; border-radius:30px; cursor:pointer;
    font-family:'Work Sans'; font-size:13px; font-weight:600;
    backdrop-filter:blur(4px);
  }

  .room-panel{ display:none; width:100%; margin-top:18px; text-align:left; }
  .room-panel.active{ display:block; }

  /* ---- Galería ---- */
  .galleryCount{ text-align:center; font-size:12px; opacity:.8; margin-bottom:10px; letter-spacing:.05em; }
  .gallery-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px;
  }
  .gallery-tile{
    position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden;
    background:rgba(255,255,255,.12); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(255,255,255,.25);
  }
  .gallery-tile img{ width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-tile.addTile{ font-size:28px; font-weight:300; color:var(--cream); opacity:.85; }
  .gallery-tile.addTile:hover{ background:rgba(255,255,255,.2); }
  .gallery-tile.selected{ outline:3px solid var(--cream); outline-offset:2px; }
  .gallery-tile .delTile{
    position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%;
    background:rgba(20,10,4,.6); color:var(--cream); border:none; font-size:12px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .room-actions{ display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap; }
  .room-actions button{
    padding:9px 20px; border:none; border-radius:22px; background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.4); color:var(--cream); font-weight:600; font-size:13px; cursor:pointer;
  }
  .room-actions button:disabled{ opacity:.45; cursor:not-allowed; }

  #lightbox{
    position:fixed; inset:0; z-index:200; background:rgba(20,10,4,.92);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px;
    opacity:0; visibility:hidden; transition:opacity .3s ease, visibility .3s ease;
  }
  #lightbox.visible{ opacity:1; visibility:visible; }
  #lightbox img{ max-width:90vw; max-height:70vh; border-radius:10px; box-shadow:0 20px 50px rgba(0,0,0,.5); }
  #lightbox .lbBtns{ display:flex; gap:12px; }
  #lightbox button{
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.4); color:var(--cream);
    padding:8px 16px; border-radius:24px; cursor:pointer; font-size:13px;
  }
  #lightboxDelete{ border-color:var(--rust); }

  /* ---- Sala ---- */
  .musicNow{ text-align:center; font-size:15px; font-weight:600; margin-bottom:16px; }
  .musicForm{ display:flex; flex-direction:column; gap:10px; }
  .musicForm input{
    padding:10px 14px; border-radius:20px; border:1px solid rgba(255,255,255,.4);
    background:rgba(255,255,255,.1); color:var(--cream); font-size:14px;
  }
  .musicForm input::placeholder{ color:rgba(255,255,255,.6); }
  .musicForm button, .bigPlayBtn{
    align-self:center; margin-top:4px; padding:10px 28px; border:none; border-radius:24px;
    background:var(--cream); color:var(--umber); font-weight:600; cursor:pointer; font-size:14px;
  }
  .bigPlayBtn{ margin-top:20px; }

  /* ---- Recuerdos ---- */
  .memoryForm{ display:flex; flex-direction:column; gap:10px; }
  .memoryForm input, .memoryForm textarea{
    padding:10px 14px; border-radius:14px; border:1px solid rgba(255,255,255,.4);
    background:rgba(255,255,255,.1); color:var(--cream); font-size:14px; font-family:inherit;
  }
  .memoryForm textarea{ min-height:70px; resize:vertical; }
  .memoryForm input::placeholder, .memoryForm textarea::placeholder{ color:rgba(255,255,255,.6); }
  .memoryForm button{
    align-self:center; margin-top:2px; padding:10px 28px; border:none; border-radius:24px;
    background:var(--cream); color:var(--umber); font-weight:600; cursor:pointer; font-size:14px;
  }
  .memory-timeline{ margin-top:26px; position:relative; padding-left:20px; }
  .memory-timeline::before{
    content:''; position:absolute; left:5px; top:4px; bottom:4px; width:2px; background:rgba(255,255,255,.3);
  }
  .memory-item{ position:relative; margin-bottom:20px; }
  .memory-item::before{
    content:''; position:absolute; left:-20px; top:5px; width:10px; height:10px; border-radius:50%;
    background:var(--cream);
  }
  .memory-date{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; opacity:.75; }
  .memory-title{ font-size:16px; font-weight:600; margin-top:2px; font-family:'Fraunces', serif; font-style:italic; }
  .memory-desc{ font-size:13px; line-height:1.5; opacity:.9; margin-top:4px; }
  .memory-del{
    margin-top:6px; background:none; border:none; color:rgba(255,255,255,.6); font-size:11px;
    cursor:pointer; text-decoration:underline;
  }
  .empty-hint{ text-align:center; opacity:.75; font-size:13px; margin-top:10px; }

  /* ===== GATO (persistente) ===== */
  #cat{
    position:fixed; bottom:18px; left:18px; z-index:80;
    width:64px; height:52px; cursor:pointer;
    animation:catBob 3.2s ease-in-out infinite;
  }
  @keyframes catBob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
  #cat .body{ position:absolute; bottom:0; left:8px; width:44px; height:30px; background:#FBFAF7; border-radius:50% 50% 45% 45%; border:1.5px solid #E4E0D6; }
  #cat .head{ position:absolute; bottom:22px; left:16px; width:28px; height:24px; background:#FBFAF7; border-radius:50%; border:1.5px solid #E4E0D6; }
  #cat .ear{ position:absolute; bottom:38px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:10px solid #FBFAF7; }
  #cat .ear.l{ left:16px; } #cat .ear.r{ left:32px; }
  #cat .tail{ position:absolute; bottom:6px; right:2px; width:20px; height:20px; border:3px solid #FBFAF7; border-radius:50%; border-bottom-color:transparent; border-left-color:transparent; transform:rotate(30deg); }
  #catMsg{
    position:absolute; bottom:70px; left:0; background:var(--cream); color:var(--ink);
    padding:6px 12px; border-radius:14px; font-size:12px; white-space:nowrap;
    opacity:0; transform:translateY(6px); transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 4px 10px rgba(0,0,0,.12);
  }
  #catMsg.show{ opacity:1; transform:translateY(0); }

  /* ===== REPRODUCTOR DE MUSICA (persistente) ===== */
  #player{
    position:fixed; bottom:18px; right:18px; z-index:80;
    display:flex; align-items:center; gap:10px;
    background:rgba(46,32,19,.85); backdrop-filter:blur(6px);
    padding:8px 14px 8px 8px; border-radius:30px;
    color:var(--cream); box-shadow:0 8px 20px rgba(0,0,0,.25);
    cursor:pointer; max-width:min(70vw,240px);
  }
  #discBtn{
    width:34px; height:34px; border-radius:50%; background:var(--gold);
    border:none; cursor:pointer; position:relative; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  #discBtn::after{ content:''; width:8px; height:8px; background:var(--ink); border-radius:50%; }
  #discBtn.playing{ animation:spin 3s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  #trackInfo{ display:flex; flex-direction:column; line-height:1.2; overflow:hidden; }
  #trackName{ font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #trackHint{ font-size:10px; opacity:.65; }

  @media (max-width:600px){
    .room-btn .label{ display:none; }
    .room-btn .sign{ width:44px; height:44px; }
    #character{ height:66%; }
    #tree{ width:150px; height:42%; }
  }
</style>
</head>
<body>

  <!-- ===== PANTALLA DE BIENVENIDA ===== -->
  <div id="welcome">
    <h1 class="display">Hola, Triana</h1>
    <p>Esta es tu casa. La construí para ti, cuarto por cuarto, con las cosas que más te gustan — cámbiate de ropa, mira nuestras fotos, escucha música y quédate un rato.</p>
    <div id="daysTogether"></div>
    <button id="enterBtn">Entrar a casa</button>
  </div>

  <!-- ===== CASA (HUB) ===== -->
  <div id="hub">
    <div id="hubTitle">
      <span>Bienvenida a</span>
      <h1 class="display">Casa de Triana</h1>
      <div id="liveCounter"></div>
    </div>

    <div id="tree">
      <svg viewBox="0 0 230 400" xmlns="http://www.w3.org/2000/svg">
        <path d="M118 400 L112 250 M112 290 Q90 260 66 235 M112 270 Q140 235 168 210 M112 240 Q84 205 52 190 M112 220 Q150 190 182 165"
          stroke="#5C3A22" stroke-width="13" stroke-linecap="round" fill="none"/>
        <path d="M118 400 L112 250 M112 290 Q90 260 66 235 M112 270 Q140 235 168 210 M112 240 Q84 205 52 190 M112 220 Q150 190 182 165"
          stroke="#7A4A2A" stroke-width="6" stroke-linecap="round" fill="none" opacity=".6"/>
        <ellipse cx="75" cy="160" rx="62" ry="56" fill="#A3572E"/>
        <ellipse cx="150" cy="150" rx="58" ry="52" fill="#C1531C"/>
        <ellipse cx="112" cy="105" rx="66" ry="60" fill="#D9A441"/>
        <ellipse cx="60" cy="120" rx="42" ry="38" fill="#8C4A24" opacity=".9"/>
        <ellipse cx="168" cy="110" rx="40" ry="36" fill="#E08A3E" opacity=".85"/>
        <ellipse cx="112" cy="70" rx="44" ry="38" fill="#C1531C" opacity=".9"/>
      </svg>
      <div id="leaves"></div>
    </div>

    <img id="character" class="character-img" src="character.png" alt="Triana">

    <button class="room-btn" id="room-vestidor" data-room="vestidor">
      <span class="sign"><svg viewBox="0 0 24 24"><path d="M9 3l3 2 3-2 2 4-2 1v12H7V8L5 7z"/></svg></span>
      <span class="label">Vestidor</span>
    </button>
    <button class="room-btn" id="room-galeria" data-room="galeria">
      <span class="sign"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg></span>
      <span class="label">Galería</span>
    </button>
    <button class="room-btn" id="room-sala" data-room="sala">
      <span class="sign"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
      <span class="label">Sala</span>
    </button>
    <button class="room-btn" id="room-recuerdos" data-room="recuerdos">
      <span class="sign"><svg viewBox="0 0 24 24"><path d="M20 21c0-4-4-6-8-6s-8 2-8 6M12 3l2.5 5 5.5.8-4 3.9.9 5.3L12 15.5 7.1 18l.9-5.3-4-3.9L9.5 8z"/></svg></span>
      <span class="label">Recuerdos</span>
    </button>
    <button class="room-btn" id="room-balcon" data-room="balcon">
      <span class="sign"><svg viewBox="0 0 24 24"><path d="M4 10l8-6 8 6v10H4z"/><path d="M4 20h16M9 20v-6h6v6"/></svg></span>
      <span class="label">Balcón</span>
    </button>
    <button class="room-btn" id="room-cocina" data-room="cocina">
      <span class="sign"><svg viewBox="0 0 24 24"><path d="M6 3v6a3 3 0 006 0V3M9 9v12M18 3c-2 0-3 2-3 4s1 3 3 3v10"/></svg></span>
      <span class="label">Cocina</span>
    </button>
  </div>

  <!-- ===== PANTALLA DE CUARTO ===== -->
  <div id="roomScreen">
    <button id="backBtn">← Volver a casa</button>
    <img id="roomCharacter" class="character-img" src="character.png" alt="Triana">
    <div class="roomInner">
      <h2 class="display" id="roomTitle"></h2>
      <p id="roomDesc" class="genericDesc"></p>
      <span class="tag" id="roomTag"></span>

      <!-- Vestidor -->
      <div id="panel-vestidor" class="room-panel">
        <div class="galleryCount" id="outfitCountText">0/20 looks</div>
        <div id="outfitGrid" class="gallery-grid"></div>
        <input type="file" id="outfitInput" accept="image/*" hidden>
        <div class="room-actions">
          <button id="resetOutfitBtn" type="button">Look original</button>
          <button id="exportOutfitBtn" type="button" disabled>Exportar look actual</button>
        </div>
      </div>

      <!-- Galería -->
      <div id="panel-galeria" class="room-panel">
        <div class="galleryCount" id="galleryCountText">0/30 fotos</div>
        <div id="galleryGrid" class="gallery-grid"></div>
        <input type="file" id="photoInput" accept="image/*" hidden>
      </div>

      <!-- Sala -->
      <div id="panel-sala" class="room-panel">
        <div class="musicNow trackNameDisplay">Sin música aún</div>
        <div class="musicForm">
          <input type="text" id="musicUrlInput" placeholder="Pega el link de YouTube o de un audio (mp3, etc.)">
          <input type="text" id="musicNameInput" placeholder="Nombre de la canción (opcional)">
          <button id="saveMusicBtn" type="button">Guardar canción</button>
        </div>
        <button id="salaPlayBtn" class="bigPlayBtn" type="button">▶ Reproducir</button>
      </div>

      <!-- Recuerdos -->
      <div id="panel-recuerdos" class="room-panel">
        <form id="memoryForm" class="memoryForm">
          <input type="date" id="memoryDate" required>
          <input type="text" id="memoryTitle" placeholder="Título" required maxlength="60">
          <textarea id="memoryDesc" placeholder="Cuenta el momento..." maxlength="400"></textarea>
          <button type="submit">Guardar recuerdo</button>
        </form>
        <div id="memoryTimeline" class="memory-timeline"></div>
      </div>
    </div>
  </div>

  <!-- ===== LIGHTBOX DE FOTOS ===== -->
  <div id="lightbox">
    <img id="lightboxImg" src="" alt="">
    <div class="lbBtns">
      <button id="lightboxDelete" type="button">Eliminar foto</button>
      <button id="lightboxClose" type="button">Cerrar</button>
    </div>
  </div>

  <!-- ===== GATO ===== -->
  <div id="cat">
    <div id="catMsg">miau ♡</div>
    <div class="tail"></div>
    <div class="ear l"></div>
    <div class="ear r"></div>
    <div class="body"></div>
    <div class="head"></div>
  </div>

  <!-- ===== REPRODUCTOR DE MUSICA ===== -->
  <div id="player">
    <button id="discBtn"></button>
    <div id="trackInfo">
      <div id="trackName" class="trackNameDisplay">Sin música aún</div>
      <div id="trackHint">Toca para reproducir</div>
    </div>
  </div>

  <div id="ytHost" style="position:fixed; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none;"></div>

<script>
  /* =========================================================
     CONTADOR EN VIVO — día 0 es el primer acceso real al link
     ========================================================= */
  const DAY0_KEY = 'triana_day0';
  let day0 = localStorage.getItem(DAY0_KEY);
  if(!day0){
    day0 = new Date().toISOString();
    localStorage.setItem(DAY0_KEY, day0);
  }
  const day0Date = new Date(day0);

  function pad(n){ return String(n).padStart(2,'0'); }
  function formatElapsed(){
    const diff = Math.max(0, Date.now() - day0Date.getTime());
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins  = Math.floor((diff % 3600000) / 60000);
    const secs  = Math.floor((diff % 60000) / 1000);
    return { days, hours, mins, secs,
      text: `${days} día${days===1?'':'s'} juntos · ${pad(hours)}:${pad(mins)}:${pad(secs)}` };
  }
  const daysTogetherEl = document.getElementById('daysTogether');
  const liveCounterEl  = document.getElementById('liveCounter');
  function tickCounter(){
    const f = formatElapsed();
    daysTogetherEl.textContent = f.text;
    liveCounterEl.textContent  = f.text;
  }
  tickCounter();
  setInterval(tickCounter, 1000);

  // ── Bienvenida ──
  document.getElementById('enterBtn').addEventListener('click', () => {
    document.getElementById('welcome').classList.add('hidden');
  });

  /* =========================================================
     CUARTOS
     ========================================================= */
  const rooms = {
    vestidor:  { title:'Vestidor', desc:'', color:'#C1531C', bg:'vestidor-bg.png' },
    galeria:   { title:'Galería', desc:'', color:'#4F6B3D', bg:'galeria-bg.png' },
    sala:      { title:'Sala', desc:'', color:'#6B3A22', bg:'sala-bg.png' },
    recuerdos: { title:'Cuarto de recuerdos', desc:'', color:'#D9A441', bg:'recuerdos-bg.png' },
    balcon:    { title:'Balcón y jardín', desc:'Con clima y ciclo de día y noche real. Sal a tomar aire cuando quieras.', color:'#3E7CB1', bg:'balcon-bg.png' },
    cocina:    { title:'Cocina', desc:'Un rincón simbólico, con detalles especiales que iremos agregando.', color:'#A3572E', bg:'cocina-bg.png' },
  };

  const character   = document.getElementById('character');
  const roomScreen   = document.getElementById('roomScreen');
  const roomTitle    = document.getElementById('roomTitle');
  const roomDesc     = document.getElementById('roomDesc');
  const roomTag      = document.getElementById('roomTag');

  document.querySelectorAll('.room-panel').forEach(p => p.classList.remove('active'));

  document.querySelectorAll('.room-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.room;
      const data = rooms[key];
      character.classList.add('teleporting');
      setTimeout(() => {
        roomScreen.style.backgroundImage = `linear-gradient(180deg, ${data.color}55 0%, ${data.color}cc 75%), url('${data.bg}')`;
        roomTitle.textContent = data.title;
        roomDesc.textContent = data.desc;
        roomDesc.style.display = data.desc ? 'block' : 'none';
        roomTag.textContent = 'Casa de Triana';
        roomScreen.classList.add('visible');

        document.querySelectorAll('.room-panel').forEach(p => p.classList.remove('active'));
        if(key === 'vestidor'){ document.getElementById('panel-vestidor').classList.add('active'); renderOutfits(); }
        if(key === 'galeria'){ document.getElementById('panel-galeria').classList.add('active'); renderGallery(); }
        if(key === 'sala'){ document.getElementById('panel-sala').classList.add('active'); }
        if(key === 'recuerdos'){ document.getElementById('panel-recuerdos').classList.add('active'); renderMemories(); }
      }, 200);
    });
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    roomScreen.classList.remove('visible');
    setTimeout(() => character.classList.remove('teleporting'), 150);
  });

  // ── Gato ──
  const cat = document.getElementById('cat');
  const catMsg = document.getElementById('catMsg');
  const catMessages = ['miau ♡', 'ronroneo...', '¡hola!', 'quiéreme'];
  cat.addEventListener('click', () => {
    catMsg.textContent = catMessages[Math.floor(Math.random()*catMessages.length)];
    catMsg.classList.add('show');
    setTimeout(() => catMsg.classList.remove('show'), 1400);
  });

  /* =========================================================
     ARBOL DE OTOÑO — hojas cayendo en loop
     ========================================================= */
  (function initLeaves(){
    const container = document.getElementById('leaves');
    const colors = ['#C1531C', '#D9A441', '#A3572E', '#8C4A24'];
    const count = 12;
    for(let i=0;i<count;i++){
      const leaf = document.createElement('div');
      leaf.className = 'leaf';
      leaf.style.left = (10 + Math.random()*80) + 'px';
      leaf.style.background = colors[i % colors.length];
      leaf.style.setProperty('--drift', (Math.random()*36-18) + 'px');
      const duration = 6 + Math.random()*6;
      leaf.style.animationDuration = duration + 's';
      leaf.style.animationDelay = (-Math.random()*duration) + 's';
      container.appendChild(leaf);
    }
  })();

  /* =========================================================
     BASE DE DATOS COMPARTIDA (fotos + outfits)
     ========================================================= */
  const DB_NAME = 'trianaHouseDB', DB_VERSION = 2, MAX_PHOTOS = 30, MAX_OUTFITS = 20;
  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains('photos')){
          db.createObjectStore('photos', { keyPath:'id', autoIncrement:true });
        }
        if(!db.objectStoreNames.contains('outfits')){
          db.createObjectStore('outfits', { keyPath:'id', autoIncrement:true });
        }
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = e => reject(e.target.error);
    });
  }
  function storeGetAll(storeName){
    return openDB().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess = () => resolve(req.result.sort((a,b) => a.createdAt - b.createdAt));
      req.onerror = () => reject(req.error);
    }));
  }
  function storeAdd(storeName, value){
    return openDB().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      const req = tx.objectStore(storeName).add(value);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    }));
  }
  function storeDelete(storeName, id){
    return openDB().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    }));
  }
  function storeGet(storeName, id){
    return openDB().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    }));
  }

  /* =========================================================
     VESTIDOR — importar/exportar looks, aplicar al personaje
     ========================================================= */
  const ACTIVE_OUTFIT_KEY = 'triana_active_outfit';
  const characterEls = () => document.querySelectorAll('.character-img');
  const outfitGrid = document.getElementById('outfitGrid');
  const outfitCountText = document.getElementById('outfitCountText');
  const outfitInput = document.getElementById('outfitInput');
  const exportOutfitBtn = document.getElementById('exportOutfitBtn');
  const resetOutfitBtn = document.getElementById('resetOutfitBtn');

  function getActiveOutfitId(){
    const raw = localStorage.getItem(ACTIVE_OUTFIT_KEY);
    return raw ? Number(raw) : null;
  }
  function setActiveOutfitId(id){
    if(id == null) localStorage.removeItem(ACTIVE_OUTFIT_KEY);
    else localStorage.setItem(ACTIVE_OUTFIT_KEY, String(id));
  }
  async function applyActiveOutfit(){
    const id = getActiveOutfitId();
    if(id != null){
      const outfit = await storeGet('outfits', id).catch(() => null);
      if(outfit){
        characterEls().forEach(el => el.src = outfit.dataURL);
        exportOutfitBtn.disabled = false;
        return;
      }
    }
    characterEls().forEach(el => el.src = 'character.png');
    exportOutfitBtn.disabled = true;
  }

  async function renderOutfits(){
    const outfits = await storeGetAll('outfits');
    const activeId = getActiveOutfitId();
    outfitCountText.textContent = `${outfits.length}/${MAX_OUTFITS} looks`;
    outfitGrid.innerHTML = '';
    outfits.forEach(o => {
      const tile = document.createElement('div');
      tile.className = 'gallery-tile' + (o.id === activeId ? ' selected' : '');
      const img = document.createElement('img');
      img.src = o.dataURL;
      img.loading = 'lazy';
      tile.appendChild(img);
      const del = document.createElement('button');
      del.className = 'delTile'; del.type = 'button'; del.textContent = '✕';
      del.addEventListener('click', async e => {
        e.stopPropagation();
        await storeDelete('outfits', o.id);
        if(getActiveOutfitId() === o.id){ setActiveOutfitId(null); applyActiveOutfit(); }
        renderOutfits();
      });
      tile.appendChild(del);
      tile.addEventListener('click', () => {
        setActiveOutfitId(o.id);
        applyActiveOutfit();
        renderOutfits();
      });
      outfitGrid.appendChild(tile);
    });
    if(outfits.length < MAX_OUTFITS){
      const addTile = document.createElement('div');
      addTile.className = 'gallery-tile addTile';
      addTile.textContent = '+';
      addTile.addEventListener('click', () => outfitInput.click());
      outfitGrid.appendChild(addTile);
    }
  }

  outfitInput.addEventListener('change', async () => {
    const file = outfitInput.files[0];
    outfitInput.value = '';
    if(!file) return;
    const outfits = await storeGetAll('outfits');
    if(outfits.length >= MAX_OUTFITS) return;
    try{
      const dataURL = await resizeImage(file, 1200, 0.88);
      const id = await storeAdd('outfits', { dataURL, createdAt: Date.now() });
      setActiveOutfitId(id);
      await applyActiveOutfit();
      renderOutfits();
    }catch(err){
      console.error('No se pudo importar el look', err);
    }
  });

  resetOutfitBtn.addEventListener('click', () => {
    setActiveOutfitId(null);
    applyActiveOutfit();
    renderOutfits();
  });

  exportOutfitBtn.addEventListener('click', async () => {
    const id = getActiveOutfitId();
    if(id == null) return;
    const outfit = await storeGet('outfits', id).catch(() => null);
    if(!outfit) return;
    const a = document.createElement('a');
    a.href = outfit.dataURL;
    a.download = 'triana-look.jpg';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  applyActiveOutfit();

  /* =========================================================
     GALERIA — fotos guardadas en IndexedDB (hasta 30)
     ========================================================= */
  async function addPhoto(dataURL){
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('photos', 'readwrite');
      const req = tx.objectStore('photos').add({ dataURL, createdAt: Date.now() });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function getAllPhotos(){
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('photos', 'readonly');
      const req = tx.objectStore('photos').getAll();
      req.onsuccess = () => resolve(req.result.sort((a,b) => a.createdAt - b.createdAt));
      req.onerror = () => reject(req.error);
    });
  }
  async function deletePhoto(id){
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('photos', 'readwrite');
      tx.objectStore('photos').delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  function resizeImage(file, maxDim=900, quality=0.8){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = e => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          let { width, height } = img;
          if(width > height && width > maxDim){ height = height * maxDim / width; width = maxDim; }
          else if(height > maxDim){ width = width * maxDim / height; height = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  const galleryGrid = document.getElementById('galleryGrid');
  const galleryCountText = document.getElementById('galleryCountText');
  const photoInput = document.getElementById('photoInput');

  async function renderGallery(){
    const photos = await getAllPhotos();
    galleryCountText.textContent = `${photos.length}/${MAX_PHOTOS} fotos`;
    galleryGrid.innerHTML = '';
    photos.forEach(p => {
      const tile = document.createElement('div');
      tile.className = 'gallery-tile';
      const img = document.createElement('img');
      img.src = p.dataURL;
      img.loading = 'lazy';
      tile.appendChild(img);
      tile.addEventListener('click', () => openLightbox(p.id, p.dataURL));
      galleryGrid.appendChild(tile);
    });
    if(photos.length < MAX_PHOTOS){
      const addTile = document.createElement('div');
      addTile.className = 'gallery-tile addTile';
      addTile.textContent = '+';
      addTile.addEventListener('click', () => photoInput.click());
      galleryGrid.appendChild(addTile);
    }
  }

  photoInput.addEventListener('change', async () => {
    const file = photoInput.files[0];
    photoInput.value = '';
    if(!file) return;
    const photos = await getAllPhotos();
    if(photos.length >= MAX_PHOTOS) return;
    try{
      const dataURL = await resizeImage(file);
      await addPhoto(dataURL);
      renderGallery();
    }catch(err){
      console.error('No se pudo guardar la foto', err);
    }
  });

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxDelete = document.getElementById('lightboxDelete');
  const lightboxClose = document.getElementById('lightboxClose');
  let currentLightboxId = null;

  function openLightbox(id, dataURL){
    currentLightboxId = id;
    lightboxImg.src = dataURL;
    lightbox.classList.add('visible');
  }
  function closeLightbox(){
    lightbox.classList.remove('visible');
    currentLightboxId = null;
  }
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', e => { if(e.target === lightbox) closeLightbox(); });
  lightboxDelete.addEventListener('click', async () => {
    if(currentLightboxId == null) return;
    await deletePhoto(currentLightboxId);
    closeLightbox();
    renderGallery();
  });

  /* =========================================================
     MUSICA — YouTube o audio directo, con mini reproductor
     ========================================================= */
  const MUSIC_KEY = 'triana_music';
  // Si quieres una canción por defecto, pon aquí el link de YouTube o el mp3.
  const DEFAULT_SONG = { url:'https://youtu.be/h6hml13Syyw?si=VJ16rKACe4WWlncF', name:'Nuestra canción' };

  function loadSavedMusic(){
    try{
      const raw = localStorage.getItem(MUSIC_KEY);
      if(raw){
        const saved = JSON.parse(raw);
        if(saved && saved.url) return saved;
      }
    }catch(e){}
    return DEFAULT_SONG.url ? { ...DEFAULT_SONG } : null;
  }
  function saveMusic(track){
    localStorage.setItem(MUSIC_KEY, JSON.stringify(track));
  }

  let currentTrack = loadSavedMusic();
  let currentType = null; // 'youtube' | 'audio'
  let isPlaying = false;
  let ytPlayer = null;
  let ytReady = false;
  const audioEl = new Audio();
  audioEl.addEventListener('ended', () => { isPlaying = false; updatePlayUI(); });

  function extractYouTubeId(url){
    const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function loadYouTubeAPI(){
    return new Promise(resolve => {
      if(window.YT && window.YT.Player){ resolve(); return; }
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      window.onYouTubeIframeAPIReady = () => resolve();
      document.head.appendChild(tag);
    });
  }

  async function ensureYT(videoId){
    if(!ytReady){
      await loadYouTubeAPI();
      ytReady = true;
    }
    if(!ytPlayer){
      await new Promise(resolve => {
        ytPlayer = new YT.Player('ytHost', {
          height:'1', width:'1', videoId,
          playerVars:{ autoplay:0, controls:0 },
          events:{
            onReady: () => resolve(),
            onStateChange: e => {
              if(e.data === YT.PlayerState.PLAYING){ isPlaying = true; updatePlayUI(); }
              if(e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED){ isPlaying = false; updatePlayUI(); }
            },
            onError: e => {
              // 2/5 = video inválido, 100/101/150 = el dueño del video bloqueó la reproducción externa (embed)
              console.error('Error de YouTube al reproducir, código:', e.data);
              isPlaying = false;
              updatePlayUI();
              document.getElementById('trackHint').textContent = 'No se pudo reproducir este link';
            }
          }
        });
      });
    }else{
      ytPlayer.loadVideoById(videoId);
    }
  }

  function stopCurrent(){
    if(currentType === 'youtube' && ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
    if(currentType === 'audio') audioEl.pause();
    isPlaying = false;
  }

  const trackNameDisplays = () => document.querySelectorAll('.trackNameDisplay');
  function updateTrackNameUI(name){
    trackNameDisplays().forEach(el => el.textContent = name || 'Sin música aún');
  }
  function updatePlayUI(){
    document.getElementById('discBtn').classList.toggle('playing', isPlaying);
    document.getElementById('salaPlayBtn').textContent = isPlaying ? '⏸ Pausar' : '▶ Reproducir';
    document.getElementById('trackHint').textContent = isPlaying ? 'Sonando ahora' : 'Toca para reproducir';
  }

  async function activateTrack(track, autoplay){
    if(!track || !track.url){
      currentType = null;
      updateTrackNameUI('');
      return;
    }
    stopCurrent();
    try{
      const yid = extractYouTubeId(track.url);
      if(yid){
        currentType = 'youtube';
        await ensureYT(yid);
        if(autoplay && ytPlayer.playVideo){ ytPlayer.playVideo(); }
      }else{
        currentType = 'audio';
        audioEl.src = track.url;
        if(autoplay) await audioEl.play();
      }
      isPlaying = !!autoplay;
      updateTrackNameUI(track.name || 'Canción nuestra');
      updatePlayUI();
    }catch(err){
      console.error('No se pudo activar la canción:', err);
      isPlaying = false;
      updateTrackNameUI(track.name || 'Canción nuestra');
      updatePlayUI();
      document.getElementById('trackHint').textContent = 'Toca ▶ para intentar de nuevo';
    }
  }

  function togglePlay(){
    if(!currentTrack || !currentTrack.url) return;
    if(!currentType){ activateTrack(currentTrack, true); return; }
    if(currentType === 'youtube' && ytPlayer){
      isPlaying ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
    }else if(currentType === 'audio'){
      if(isPlaying) audioEl.pause(); else audioEl.play().catch(()=>{});
      isPlaying = !isPlaying;
      updatePlayUI();
    }
  }

  document.getElementById('discBtn').addEventListener('click', togglePlay);
  document.getElementById('salaPlayBtn').addEventListener('click', togglePlay);

  document.getElementById('saveMusicBtn').addEventListener('click', () => {
    const url = document.getElementById('musicUrlInput').value.trim();
    const name = document.getElementById('musicNameInput').value.trim();
    if(!url) return;
    currentTrack = { url, name };
    saveMusic(currentTrack);
    document.getElementById('musicUrlInput').value = '';
    document.getElementById('musicNameInput').value = '';
    activateTrack(currentTrack, true);
  });

  // Estado inicial del reproductor (sin autoplay hasta que ella toque play)
  updateTrackNameUI(currentTrack ? currentTrack.name : '');

  /* =========================================================
     RECUERDOS — formulario + línea de tiempo
     ========================================================= */
  const MEMORIES_KEY = 'triana_memories';
  function loadMemories(){
    try{ return JSON.parse(localStorage.getItem(MEMORIES_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveMemories(list){
    localStorage.setItem(MEMORIES_KEY, JSON.stringify(list));
  }
  function formatMemoryDate(iso){
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' });
  }
  function renderMemories(){
    const list = loadMemories().sort((a,b) => a.date.localeCompare(b.date));
    const timeline = document.getElementById('memoryTimeline');
    timeline.innerHTML = '';
    if(list.length === 0){
      timeline.innerHTML = '<div class="empty-hint">Todavía no hay recuerdos guardados. Agrega el primero arriba.</div>';
      timeline.style.paddingLeft = '0';
      return;
    }
    timeline.style.paddingLeft = '20px';
    list.forEach(m => {
      const item = document.createElement('div');
      item.className = 'memory-item';
      item.innerHTML = `
        <div class="memory-date">${formatMemoryDate(m.date)}</div>
        <div class="memory-title">${escapeHTML(m.title)}</div>
        ${m.desc ? `<div class="memory-desc">${escapeHTML(m.desc)}</div>` : ''}
        <button class="memory-del" type="button">Eliminar</button>
      `;
      item.querySelector('.memory-del').addEventListener('click', () => {
        const updated = loadMemories().filter(x => x.id !== m.id);
        saveMemories(updated);
        renderMemories();
      });
      timeline.appendChild(item);
    });
  }
  function escapeHTML(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('memoryForm').addEventListener('submit', e => {
    e.preventDefault();
    const date = document.getElementById('memoryDate').value;
    const title = document.getElementById('memoryTitle').value.trim();
    const desc = document.getElementById('memoryDesc').value.trim();
    if(!date || !title) return;
    const list = loadMemories();
    list.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2), date, title, desc });
    saveMemories(list);
    document.getElementById('memoryForm').reset();
    renderMemories();
  });
</script>
</body>
</html>
